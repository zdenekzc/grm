# Per-demo podman config. Sourced by setup-kube.sh via CONTAINERS_CONF so
# kind-spawned `podman run` uses cgroupfs (avoids the systemd user.slice
# errors we hit on Fedora rootless sessions:
#   "failed to move the rootless netns pasta process to the systemd
#    user.slice: Process org.freedesktop.systemd1 exited with status 1").
#
# Keep scope local: we do NOT install this into ~/.config/containers/.

[engine]
cgroup_manager = "cgroupfs"
