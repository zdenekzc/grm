# MySQL 8 Deployment + Service + Secret. Data volume is emptyDir for demo
# simplicity — schema.sql re-seeds on every fresh Pod (Secret fixes creds
# across restarts; data is ephemeral, which is fine for classroom use).
#
# The init ConfigMap with schema.sql is created by setup-kube.sh at apply
# time (not here) so students can edit tools/kube-tools/k8s/schema.sql and re-run
# --apply without touching YAML.

apiVersion: v1
kind: Secret
metadata:
  name: shop-db
type: Opaque
stringData:
  root-password: rootpass
  password:      shoppass
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  labels: { app: mysql }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: mysql }
  template:
    metadata:
      labels: { app: mysql }
    spec:
      containers:
        - name: mysql
          image: mysql:8
          # IfNotPresent avoids a second pull when setup-kube.sh --build
          # has already loaded mysql:8 into the kind node; falls back to
          # pulling if the image genuinely is missing.
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: shop-db, key: root-password }
            - name: MYSQL_DATABASE
              value: shop
            - name: MYSQL_USER
              value: shop
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: { name: shop-db, key: password }
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: init-sql
          configMap:
            name: mysql-init
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  selector: { app: mysql }
  ports:
    - port: 3306
      targetPort: 3306
