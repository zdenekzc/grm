# tools.ini — example sources wired into the &Examples top-level menu.
#
# Each [section] becomes a submenu (label from the `title` key); the
# `files` value is a whitespace- / newline-separated list of paths
# relative to the project root. Clicking a menu item just opens the
# example file in the editor.

[cmm-examples]
title = C-- examples
files =
    tests/examples/avl.cc
    tests/examples/btree.cc
    tests/examples/dama.cc
    tests/examples/heapsort.cc
    tests/examples/jezdec.cc
    tests/examples/quicksort.cc
    tests/examples/veze.cc

[grammar-examples]
title = Grammar examples
files =
    cmm/cmm.g
    tests/grammar/pas.g

[t-examples]
title = .t examples
files =
    tests/t-examples/application.t
    tests/t-examples/button.t
    tests/t-examples/component.t
    tests/t-examples/generate.t
    tests/t-examples/instr.t
    tests/t-examples/window.t

[set-examples]
title = Set Examples
files =
    set/json-example.t
    set/json.t
    set/textio-example.t
    set/textio.t
    set/xml-example.t
    set/xml.t
