# tools.ini — example sources wired into the &Examples top-level menu.
#
# Each [section] becomes a submenu (label from the `title` key); the
# `files` value is a whitespace- / newline-separated list of paths
# relative to the editor's working directory. Clicking a menu item
# hands the file to cmm/cmm_run.py — the same path the C-- Make
# action uses.

[cmm-examples]
title = C-- Examples
files =
    examples/cmm-examples/application.t
    examples/cmm-examples/button.t
    examples/cmm-examples/component.t
    examples/cmm-examples/generate.t
    examples/cmm-examples/instr.t
    examples/cmm-examples/window.t

[set-examples]
title = Set Examples
files =
    set/json-example.t
    set/json.t
    set/textio-example.t
    set/textio.t
    set/xml-example.t
    set/xml.t
