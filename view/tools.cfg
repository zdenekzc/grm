
/* Plugins */

Plugin
{
   title = "&C--";
   key = "cmm";
   module = "cmm/cmm_plugin";
   cls = "Plugin";
}

/* ---------------------------------------------------------------------- */

/* Project menu - commands */

Command "configure"
{
   // cd = "direcory_name"
   cd = "../.."

   // set = "ABC = abc"
   // set = "KLM = something another"

   // cmd = "./configure"
   cmd = "pwd ; ./autoinit"
}

Command build
{
   env = configure
   cmd = "make clean ; make"
}

Command make
{
   env = configure
   cmd = "make"
}

Command run
{
   env = configure
   cmd = "make run"
}

Command clean
{
   env = configure
   cmd = "make clean"
}

Command install
{
   env = configure
   cmd = "make install"
}

Command "run-python"
{
   python_cmd = true // original Python executable
   // cmd = "python3"
   // cmd = "/opt/python27/bin/python -B"
   // cmd = "python -u"
   addFileName = true
}

Command "compile-cpp"
{
   cmd="gcc -O0 -g $"
   // cmd="clang O0 -g $"
   addFileName = true
}

Command "run-cpp"
{
   cmd="gcc -O0 -g $ -o _output/run.bin  && echo COMPILED && ./_output/run.bin"
   addFileName = true
}

Command "debug-cpp"
{
   cmd="gcc -g $ -o _output/run.bin && echo COMPILED && gdb --ex run --args ./_output/run.bin"
   addFileName = true
}

/* Show commands */

Command "show-html"
{
   cmd = "( firefox $ & ) &"
   addFileName = true
}

Command "show-preview"
{
   cmd = "caja $ &"
   addFileName = true
}

Command "show-pdf"
{
   cmd = "atril $ &"
   addFileName = True
}

/* ---------------------------------------------------------------------- */

/* Tools Menu */

Menu "&Tools"

MenuItem "Firefox" { cmd = "firefox --new-window &" }
MenuItem "Atril" { cmd = "atril &" }
MenuItem "Lout" { cmd = "lout $ && atril" }

MenuSeparator

MenuItem "Python to C--"
{
   ext = ".py"
   module = "code/py_to_cmm.py"
   func = py_to_cmm
   addWin = true
   addFileName = true
}

MenuItem "Gtk-- Test"
{
   param = plain/simple-gtkmm.cc
}

